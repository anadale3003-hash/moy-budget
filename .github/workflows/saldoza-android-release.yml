name: Saldoza Android release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saldoza-android-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    if: github.ref == 'refs/heads/android-preparation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Stage local web assets
        run: npm run prepare:web
      - name: Generate Android project
        run: |
          if [ ! -d android ]; then npx --no-install cap add android; fi
          npx --no-install cap sync android
      - name: Build unsigned release APK
        working-directory: android-build/android
        run: bash gradlew assembleRelease --no-daemon
      - name: Sign and verify APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          : "${KEYSTORE_BASE64:?Missing keystore secret}" "${STORE_PASSWORD:?Missing store password}" "${KEY_ALIAS:?Missing key alias}" "${KEY_PASSWORD:?Missing key password}"
          umask 077
          ks=$(mktemp)
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ks"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p release-output
          "$tools/zipalign" -P 16 -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk release-output/aligned.apk
          "$tools/apksigner" sign --ks "$ks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out release-output/saldoza-release.apk release-output/aligned.apk
          "$tools/apksigner" verify --verbose --print-certs release-output/saldoza-release.apk
          rm -f release-output/aligned.apk
          sha256sum release-output/saldoza-release.apk > release-output/SHA256SUMS.txt
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: saldoza-release-apk
          path: android-build/release-output/
          if-no-files-found: error
          retention-days: 7
