name: SaldoZa unsigned release
on:
  workflow_dispatch:
  push:
    branches: [android-preparation]
    paths:
      - 'index.html'
      - 'android-build/**'
      - '.github/workflows/saldoza-android-local-signing.yml'
permissions:
  contents: read
concurrency:
  group: saldoza-unsigned-release
  cancel-in-progress: true
jobs:
  release:
    if: github.ref == 'refs/heads/android-preparation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Stage local web assets
        run: npm run prepare:web
      - name: Generate Android project
        run: |
          if [ ! -d android ]; then npx --no-install cap add android; fi
          npx --no-install cap sync android
          node apply-version.mjs
          node harden-android.mjs
      - name: Build unsigned release APK
        working-directory: android-build/android
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/saldoza-release-gradle.log"
          if bash gradlew assembleRelease --no-daemon --max-workers=4 2>&1 | tee "$log"; then exit 0; fi
          grep -q 'Received status code 429' "$log" || exit 1
          bash gradlew -I "$GITHUB_WORKSPACE/android-build/maven-central-mirror.init.gradle" assembleRelease --no-daemon --max-workers=4
      - name: Align APK for local signing
        run: |
          set -eu
          mkdir -p release-output
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -P 16 -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk release-output/saldoza-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 release-output/saldoza-release-unsigned.apk
          cd release-output
          sha256sum saldoza-release-unsigned.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: saldoza-release-unsigned
          path: android-build/release-output/
          if-no-files-found: error
          retention-days: 7
