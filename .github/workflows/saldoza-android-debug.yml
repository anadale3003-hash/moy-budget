name: Saldoza Android debug
on:
  workflow_dispatch:
  push:
    branches: [android-preparation]
    paths:
      - 'index.html'
      - 'android-build/**'
      - '.github/workflows/saldoza-android-debug.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: saldoza-android-debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug:
    outputs:
      candidate: ${{ steps.signing.outputs.artifact }}
    if: github.ref == 'refs/heads/android-preparation'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Stage local web assets
        run: npm run prepare:web
      - name: Configure test signing
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.SALDOZA_TEST_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SALDOZA_TEST_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keystore="$RUNNER_TEMP/saldoza-test.p12"
          if [[ -z "$KEYSTORE_B64" && -z "$KEYSTORE_PASSWORD" ]]; then
            artifact=saldoza-debug-apk-ephemeral
            export KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
            echo "::add-mask::$KEYSTORE_PASSWORD"
            keytool -genkeypair -keystore "$keystore" -storetype PKCS12 -storepass:env KEYSTORE_PASSWORD -alias saldoza-test -keyalg RSA -keysize 2048 -validity 30 -dname 'CN=Saldoza temporary QA'
            echo "::warning::Persistent test signing secrets are missing. This APK cannot update a different test certificate."
          else
            [[ -n "$KEYSTORE_B64" && -n "$KEYSTORE_PASSWORD" ]]
            artifact=saldoza-debug-apk
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keystore"
          fi
          printf 'SALDOZA_TEST_KEYSTORE=%s\nSALDOZA_TEST_KEYSTORE_PASSWORD=%s\n' "$keystore" "$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
      - name: Generate Android project
        run: |
          if [ ! -d android ]; then npx --no-install cap add android; fi
          npx --no-install cap sync android
          node apply-version.mjs
          node harden-android.mjs
          node test-signing.mjs
      - name: Build debug APK
        working-directory: android-build/android
        run: bash gradlew assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.artifact }}
          path: android-build/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Sign the baseline APK with the same test certificate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/saldoza-upgrade"
          mkdir -p "$work"
          if ! gh run download 45870831244 --repo "$GITHUB_REPOSITORY" --name saldoza-debug-apk --dir "$work"; then
            mkdir "$work/checkout"
            git archive 67aa0d52ac76db70c3e162c228b875062aab674e | tar -x -C "$work/checkout"
            (
              cd "$work/checkout/android-build"
              npm install --no-audit --no-fund
              npm run prepare:web
              npx --no-install cap add android
              node apply-version.mjs
              node harden-android.mjs
              cd android
              bash gradlew assembleDebug --no-daemon
            )
            cp "$work/checkout/android-build/android/app/build/outputs/apk/debug/app-debug.apk" "$work/app-debug.apk"
          fi
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$signer" sign --ks "$SALDOZA_TEST_KEYSTORE" --ks-key-alias saldoza-test --ks-pass env:SALDOZA_TEST_KEYSTORE_PASSWORD --key-pass env:SALDOZA_TEST_KEYSTORE_PASSWORD --out "$work/previous.apk" "$work/app-debug.apk"
          "$signer" verify "$work/previous.apk"
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/saldoza-test.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: saldoza-upgrade-baseline
          path: ${{ runner.temp }}/saldoza-upgrade/previous.apk
          if-no-files-found: error
          retention-days: 7

  web-regression:
    if: github.ref == 'refs/heads/android-preparation'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:release-web

  android-regression:
    needs: debug
    if: github.ref == 'refs/heads/android-preparation'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.debug.outputs.candidate }}
          path: artifacts/candidate
      - uses: actions/download-artifact@v4
        with:
          name: saldoza-upgrade-baseline
          path: artifacts/baseline
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android release regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: node android-build/test-release-android.mjs artifacts/candidate/app-debug.apk artifacts/baseline/previous.apk
