name: Saldoza Android debug
on:
  workflow_dispatch:
  push:
    branches: [android-preparation]
    paths:
      - 'android-build/**'
      - '.github/workflows/saldoza-android-debug.yml'
permissions:
  contents: read
concurrency:
  group: saldoza-android-debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug:
    if: github.ref == 'refs/heads/android-preparation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Stage local web assets
        run: npm run prepare:web
      - name: Generate Android project
        run: |
          if [ ! -d android ]; then npx --no-install cap add android; fi
          npx --no-install cap sync android
      - name: Build debug APK
        working-directory: android-build/android
        run: bash gradlew assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: saldoza-debug-apk
          path: android-build/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
